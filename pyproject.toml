[project]
name = "path-segment-splitter"
version = "0.1.1"
description = "Splits a path into its component segments, handling trailing separators, drive letters, and UNC prefixes."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
